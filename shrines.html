<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>LG Productions • Shrines</title>
        <link rel="icon" href="https://lgplayer13.neocities.org/siteLogo.png" type="image/x-icon">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <link rel="stylesheet" href="/style3.css" type="text/css" media="all">
        <script src="/javascript/components.js" type="text/javascript" defer></script>
        <style>
            body {
                --bgGradient1: rgba(226, 226, 226, 0.87);
                --bgGradient2: rgba(197, 197, 197, 0.87);
            }
            footer {
                --color: black;
                --shadow: transparent;
            }
            
            /* bg stuffs */
            #water {
                position: fixed;
                background-image: url("images/decor/shrineWater.svg"), linear-gradient(rgba(0,0,0,0.2));
                background-repeat: repeat-x, repeat;
                background-size: 80%, cover;
                width: 100%;
                height: 24%;
                bottom: 13%;
                animation: waterFlow 30s linear infinite, waterRise 5s ease-in-out infinite;
            }
            #ground {
                position: fixed;
                background: url("images/backgrounds/shrineGround.svg") repeat;
                background-size: contain;
                width: 100%;
                height: 23%;
                bottom: 0;
                box-shadow: 0 0 20px rgba(0,0,0,0.25);
            }
            
            .shrinePortal {
                position: fixed;
                top: 5%;
                right: 7%;
                filter: drop-shadow(5px 7px 6px #000) opacity(0.5) blur(1px);
                pointer-events: none;

                & img {
                    animation: portalSpin 5s infinite linear;
                    z-index: 1;
                }

                &::before {
                    content: '';
                    position: absolute;
                    background-image: url(images/sprites/shrinePortal2.svg);
                    width: 75px;
                    height: 60px;
                    animation: portalSpin 25s infinite linear;
                }
            }
            
            /* the sidster */
            #sidster {
                position: absolute;
                width: 6%;
                bottom: 18.5%;
                left: -7%;
                animation: sidWalk 5s linear 1;
            }
            @keyframes sidWalk {
                100% {left: 100%;}
            }
            
            /* misc. + animations */
            .bgimg {display: none;}
            
            @keyframes waterFlow {
                100% {background-position-x: calc(100vw * -0.8), 0;}
            }
            @keyframes waterRise {
                50% {transform: translateY(8px);}
            }
        </style>
    </head>
    <body>
        <div id="water"></div>
        <div id="ground"></div>
        <a class="shrinePortal full-flex"><img src="images/sprites/shrinePortal1.svg"></a>
        
        <img id="sidster" src="images/sprites/sidWalk.svg">
    
        <div id="container">
            <a class="bubble headBack" href="/index.html">Head home?</a>

            <main>
                <h1>Shrines</h1>
                
                <article class="article-wide">
                    <p>working on it...</p>
                </article>
            </main>
            
            <footer-component></footer-component>
        </div>
        <script>
            const sid = document.getElementById("sidster");
            sidster.style.animationDelay = Math.round(Math.random() * (60 - 25) + 25) + "s";
        </script>
    </body>
</html>
